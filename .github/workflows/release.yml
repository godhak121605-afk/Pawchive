name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.6.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore the private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PAWCHIVE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pawchive.jks"
      - name: Build release APK
        env:
          PAWCHIVE_KEYSTORE_PATH: ${{ runner.temp }}/pawchive.jks
          PAWCHIVE_KEYSTORE_PASSWORD: ${{ secrets.PAWCHIVE_KEYSTORE_PASSWORD }}
          PAWCHIVE_KEY_ALIAS: ${{ secrets.PAWCHIVE_KEY_ALIAS }}
          PAWCHIVE_KEY_PASSWORD: ${{ secrets.PAWCHIVE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: app/build/outputs/apk/release/*.apk
