name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.6.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore the private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PAWCHIVE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pawchive.jks"
      - name: Build release APK
        env:
          PAWCHIVE_KEYSTORE_PATH: ${{ runner.temp }}/pawchive.jks
          PAWCHIVE_KEYSTORE_PASSWORD: ${{ secrets.PAWCHIVE_KEYSTORE_PASSWORD }}
          PAWCHIVE_KEY_ALIAS: ${{ secrets.PAWCHIVE_KEY_ALIAS }}
          PAWCHIVE_KEY_PASSWORD: ${{ secrets.PAWCHIVE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease
      - name: Prepare extension repository
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "Tag must start with v" >&2; exit 1 ;; esac
          VERSION="${TAG#v}"
          APK_NAME="tachiyomi-all.pawchive-v${VERSION}.apk"
          REPO_DIR="$RUNNER_TEMP/pawchive-repo"
          mkdir -p "$REPO_DIR/apk"
          cp app/build/outputs/apk/release/app-release.apk "$REPO_DIR/apk/$APK_NAME"
          printf '[{"name":"Tachiyomi: Pawchive","pkg":"eu.kanade.tachiyomi.extension.all.pawchive","apk":"apk/%s","lang":"all","code":1,"version":"%s","nsfw":1,"sources":[{"name":"Pawchive","lang":"all","id":"430936946014843045","baseUrl":"https://pawchive.pw","versionId":1,"hasCloudflare":0}]}]\n' "$APK_NAME" "$VERSION" > "$REPO_DIR/index.min.json"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: app/build/outputs/apk/release/*.apk
      - name: Publish Tachimanga repository
        run: |
          git switch --orphan repo
          git rm -rf .
          cp -R "$RUNNER_TEMP/pawchive-repo/." .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Publish Pawchive ${GITHUB_REF_NAME}"
          git push --force origin repo
